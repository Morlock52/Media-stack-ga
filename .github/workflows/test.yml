name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  unit-tests:
    name: Unit Tests (Control Server)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test -w control-server -- --run --reporter=verbose
        env:
          CI: true

  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run API integration tests
        run: npm test -w control-server -- test/api-integration.test.ts --run --reporter=verbose
        env:
          CI: true

  ui-smoke-tests:
    name: UI Smoke Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run smoke tests
        run: npm test -w docs-site -- tests/smoke.spec.ts --reporter=list
        env:
          CI: true
      
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: docs-site/playwright-report/
          retention-days: 7

  ui-comprehensive-tests:
    name: UI Comprehensive Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run comprehensive UI tests
        run: npm test -w docs-site -- tests/comprehensive-ui.spec.ts --reporter=list --workers=2
        env:
          CI: true
      
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-comprehensive-report
          path: docs-site/playwright-report/
          retention-days: 7

  e2e-workflow-tests:
    name: E2E Workflow Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E workflow tests
        run: npm test -w docs-site -- tests/e2e-workflows.spec.ts --reporter=list --workers=1
        env:
          CI: true
        timeout-minutes: 20
      
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: docs-site/playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, api-integration-tests, ui-smoke-tests, ui-comprehensive-tests, e2e-workflow-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Integration | ${{ needs.api-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Smoke Tests | ${{ needs.ui-smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Comprehensive | ${{ needs.ui-comprehensive-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Workflows | ${{ needs.e2e-workflow-tests.result }} |" >> $GITHUB_STEP_SUMMARY
