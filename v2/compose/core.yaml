# =============================================================================
#  CORE — always on. Edge routing, auth, dashboard, Docker API isolation.
# =============================================================================
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  environment: &env
    TZ: ${TZ}

services:
  # ---------------------------------------------------------------------------
  # Read-only Docker API. Nothing else in the stack mounts docker.sock.
  # ---------------------------------------------------------------------------
  socket-proxy:
    <<: *common
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    read_only: true
    tmpfs: ["/run"]
    environment:
      <<: *env
      CONTAINERS: 1
      EVENTS: 1
      IMAGES: 1        # WUD needs image metadata
      INFO: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
      POST: 0          # read-only
      DISABLE_IPV6: 1  # haproxy won't start on hosts without IPv6 otherwise
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

  # ---------------------------------------------------------------------------
  # Traefik v3.7 — TLS via Cloudflare DNS-01 so LAN access is HTTPS too.
  # Cloudflare Tunnel points at http://traefik:80 (TLS ends at Cloudflare edge).
  # ---------------------------------------------------------------------------
  traefik:
    <<: *common
    image: traefik:v3.7
    container_name: traefik
    depends_on: [socket-proxy]
    command:
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=mediastack_proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cf
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --entrypoints.websecure.http.middlewares=secure-headers@file
      - --certificatesresolvers.cf.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cf.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    environment:
      <<: *env
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}   # Zone:DNS:Edit, scoped to one zone
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CONFIG_ROOT}/traefik/letsencrypt:/letsencrypt
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [proxy, socket]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=tinyauth
      - homepage.group=Core
      - homepage.name=Traefik
      - homepage.icon=traefik.png
      - homepage.href=https://traefik.${DOMAIN}

  # ---------------------------------------------------------------------------
  # Tinyauth — forward-auth that logs in against your EXISTING Pocket ID.
  # Replaces Authelia + Redis (and actually protects routes: every UI below
  # carries `middlewares=tinyauth`). Pocket ID itself is not in this stack.
  # ---------------------------------------------------------------------------
  tinyauth:
    <<: *common
    image: ghcr.io/tinyauthapp/tinyauth:v5
    container_name: tinyauth
    environment:
      <<: *env
      TINYAUTH_APPURL: https://auth.${DOMAIN}
      TINYAUTH_AUTH_TRUSTEDPROXIES: ${PROXY_SUBNET:-172.16.0.0/12}
      TINYAUTH_OAUTH_AUTOREDIRECT: pocketid
      TINYAUTH_OAUTH_WHITELIST: ${AUTH_ALLOWED_EMAILS}
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket ID
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID: ${POCKETID_CLIENT_ID}
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET: ${POCKETID_CLIENT_SECRET}
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: ${POCKETID_URL}/authorize
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: ${POCKETID_URL}/api/oidc/token
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: ${POCKETID_URL}/api/oidc/userinfo
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: https://auth.${DOMAIN}/api/oauth/callback/pocketid
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.tinyauth.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.services.tinyauth.loadbalancer.server.port=3000
      # The middleware every protected router references:
      - traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — token via env (not argv, so it's not visible in `ps`).
  # In Zero Trust, route *.${DOMAIN} → http://traefik:80.
  # Plex should NOT go through the tunnel (Cloudflare ToS on video); use 32400.
  # ---------------------------------------------------------------------------
  cloudflared:
    <<: *common
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["remote"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      <<: *env
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [proxy]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Homepage — reads container labels through socket-proxy.
  # ---------------------------------------------------------------------------
  homepage:
    <<: *common
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    depends_on: [socket-proxy]
    environment:
      <<: *env
      HOMEPAGE_ALLOWED_HOSTS: home.${DOMAIN},hub.${DOMAIN}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      HOMEPAGE_VAR_PLEX_TOKEN: ${PLEX_TOKEN:-}
      HOMEPAGE_VAR_SONARR_API_KEY: ${SONARR_API_KEY:-}
      HOMEPAGE_VAR_RADARR_API_KEY: ${RADARR_API_KEY:-}
      HOMEPAGE_VAR_PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      HOMEPAGE_VAR_SEERR_API_KEY: ${SEERR_API_KEY:-}
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
    networks: [proxy, socket]
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`) || Host(`hub.${DOMAIN}`)
      - traefik.http.routers.homepage.middlewares=tinyauth
      - traefik.http.services.homepage.loadbalancer.server.port=3000
