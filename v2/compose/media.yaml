# =============================================================================
#  MEDIA SERVERS — profiles: plex, jellyfin, stats, books
#  Media servers see ONLY ${DATA_ROOT}/media as /data/media (read-only).
#  GPU transcoding: see docker-compose.override.yaml.example (/dev/dri).
# =============================================================================
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [proxy]

x-lsio-env: &lsio-env
  PUID: ${PUID}
  PGID: ${PGID}
  UMASK: "002"
  TZ: ${TZ}

services:
  plex:
    <<: *common
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    profiles: ["plex"]
    environment:
      <<: *lsio-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    ports:
      - "32400:32400"        # direct path for remote streaming (not via CF tunnel)
    volumes:
      - ${CONFIG_ROOT}/plex:/config
      - ${DATA_ROOT}/media:/data/media:ro
      - type: tmpfs           # RAM transcode — saves SSD wear
        target: /transcode
        tmpfs: { size: 8589934592 }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:32400/identity"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - homepage.group=Media
      - homepage.name=Plex
      - homepage.icon=plex.png
      - homepage.href=https://app.plex.tv
      - homepage.widget.type=plex
      - homepage.widget.url=http://plex:32400
      - homepage.widget.key=${PLEX_TOKEN}

  jellyfin:
    <<: *common
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    profiles: ["jellyfin"]
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://jellyfin.${DOMAIN}
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config:/config
      - ${CONFIG_ROOT}/jellyfin/cache:/cache
      - ${DATA_ROOT}/media:/data/media:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      # Jellyfin has its own login + OIDC plugin (point it at Pocket ID) → no tinyauth
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=https://jellyfin.${DOMAIN}

  tautulli:
    <<: *common
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    profiles: ["stats"]
    environment: *lsio-env
    volumes: ["${CONFIG_ROOT}/tautulli:/config"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.tautulli.rule=Host(`tautulli.${DOMAIN}`)
      - traefik.http.routers.tautulli.middlewares=tinyauth
      - traefik.http.services.tautulli.loadbalancer.server.port=8181

  audiobookshelf:
    <<: *common
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    profiles: ["books"]
    environment: { TZ: "${TZ}" }
    volumes:
      - ${CONFIG_ROOT}/audiobookshelf/config:/config
      - ${CONFIG_ROOT}/audiobookshelf/metadata:/metadata
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/media/podcasts:/podcasts      # was the same path as audiobooks
    labels:
      - traefik.enable=true
      - traefik.http.routers.abs.rule=Host(`audiobookshelf.${DOMAIN}`)
      - traefik.http.services.abs.loadbalancer.server.port=80
