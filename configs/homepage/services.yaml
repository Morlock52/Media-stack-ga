---
# Media Stack Services Configuration
# https://gethomepage.dev/configs/services/
# Production URLs use subdomains via Cloudflare Tunnel
# Set HOMEPAGE_VAR_DOMAIN in docker-compose environment

- Media:
    - Plex:
        icon: plex.png
        href: https://plex.{{HOMEPAGE_VAR_DOMAIN}}
        description: Stream Movies & TV
        siteMonitor: http://plex:32400/identity
        statusStyle: dot
        # Widget requires Plex token - see https://www.plexopedia.com/plex-media-server/general/plex-token/
        # widget:
        #   type: plex
        #   url: http://plex:32400
        #   key: {{HOMEPAGE_VAR_PLEX_TOKEN}}

    - Overseerr:
        icon: overseerr.png
        href: https://overseerr.{{HOMEPAGE_VAR_DOMAIN}}
        description: Request Media
        siteMonitor: http://overseerr:5055
        statusStyle: dot
        # Widget requires Overseerr initialization first
        # widget:
        #   type: overseerr
        #   url: http://overseerr:5055
        #   key: YOUR_OVERSEERR_API_KEY

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.{{HOMEPAGE_VAR_DOMAIN}}
        description: Torrent Downloads
        siteMonitor: http://qbittorrent:8080
        statusStyle: dot
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: admin
          password: adminadmin  # Change after first login

- Arr Stack:
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.{{HOMEPAGE_VAR_DOMAIN}}
        description: TV Series Manager
        siteMonitor: http://sonarr:8989
        statusStyle: dot
        # API key auto-populated by bootstrap script
        # widget:
        #   type: sonarr
        #   url: http://sonarr:8989
        #   key: YOUR_SONARR_API_KEY
        #   enableQueue: true

    - Radarr:
        icon: radarr.png
        href: https://radarr.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movie Manager
        siteMonitor: http://radarr:7878
        statusStyle: dot
        # widget:
        #   type: radarr
        #   url: http://radarr:7878
        #   key: YOUR_RADARR_API_KEY
        #   enableQueue: true

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.{{HOMEPAGE_VAR_DOMAIN}}
        description: Indexer Manager
        siteMonitor: http://prowlarr:9696
        statusStyle: dot
        # widget:
        #   type: prowlarr
        #   url: http://prowlarr:9696
        #   key: YOUR_PROWLARR_API_KEY

    - Bazarr:
        icon: bazarr.png
        href: https://bazarr.{{HOMEPAGE_VAR_DOMAIN}}
        description: Subtitle Manager
        siteMonitor: http://bazarr:6767
        statusStyle: dot
        # widget:
        #   type: bazarr
        #   url: http://bazarr:6767
        #   key: YOUR_BAZARR_API_KEY

- Monitoring:
    - Grafana:
        icon: grafana.png
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
        description: Logs & Analytics
        siteMonitor: http://grafana:3000
        statusStyle: dot
        widget:
          type: grafana
          url: http://grafana:3000
          username: admin
          password: mediastack

    - Loki:
        icon: loki.png
        href: https://loki.{{HOMEPAGE_VAR_DOMAIN}}
        description: Log Aggregation
        siteMonitor: http://loki:3100/ready
        statusStyle: dot

- System:
    - Watchtower:
        icon: watchtower.png
        href: https://{{HOMEPAGE_VAR_DOMAIN}}
        description: Auto Updates
        statusStyle: dot
