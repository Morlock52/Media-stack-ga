---
# Homepage Widgets
# https://gethomepage.dev/configs/widgets/

# Search bar at top
- search:
    provider: duckduckgo
    target: _blank
    showSearchSuggestions: true

# System resources with visual indicators
- resources:
    label: System
    cpu: true
    memory: true
    disk: /
    cputemp: true
    uptime: true
    refresh: 3000

# Date and time widget
- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: full
      hourCycle: h23

