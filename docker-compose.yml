networks:
  mediastack:
    name: ${DOCKER_NETWORK}
    driver: bridge

volumes:
  redis_data:

services:
  # ===========================================
  # POSTGRESQL - Database for *Arr Apps
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      # REQUIRED: Set POSTGRES_USER and POSTGRES_PASSWORD in .env
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=postgres
    volumes:
      - ${CONFIG_ROOT}/postgres:/var/lib/postgresql/data
    networks:
      - mediastack
    profiles: ["arr", "db", "sonarr", "radarr", "prowlarr"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # POSTGRES BACKUP - Automated Daily Backups
  # ===========================================
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:latest
    container_name: postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=postgres,sonarr,radarr,prowlarr
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_EXTRA_OPTS=-Z6 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/backups/postgres:/backups
    networks:
      - mediastack
    profiles: ["arr", "db", "backup"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "homepage.group=Core"
      - "homepage.name=PostgreSQL Backup"
      - "homepage.icon=postgres.png"
      - "homepage.description=Daily DB Backups"

  # ===========================================
  # AUTOHEAL - Container Auto-healing
  # ===========================================
  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mediastack
    labels:
      - "homepage.group=Core"
      - "homepage.name=Autoheal"
      - "homepage.icon=autoheal.png"
      - "homepage.description=Container Health Monitor"

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=false"
      - "--ping=true"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mediastack
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # CLOUDFLARE TUNNEL
  # ===========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # Security: Use array form to prevent shell injection
    # Set CLOUDFLARE_TUNNEL_TOKEN in .env or use config file mode
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      - ${CONFIG_ROOT}/cloudflared:/home/nonroot/.cloudflared
    networks:
      - mediastack
    profiles: ["cloudflared"]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "homepage.group=Core"
      - "homepage.name=Cloudflare Tunnel"
      - "homepage.icon=cloudflare.png"
      - "homepage.href=https://one.dash.cloudflare.com"
      - "homepage.description=Remote Access Tunnel"

  # ===========================================
  # WATCHTOWER - Auto-update Containers
  # ===========================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TIMEZONE}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_HTTP_API_METRICS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_API_TOKEN:-mediastack}
      - DOCKER_API_VERSION=1.44
    networks:
      - mediastack
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Watchtower"
      - "homepage.icon=watchtower.png"
      - "homepage.description=Auto-updater"
      - "homepage.widget.type=watchtower"
      - "homepage.widget.url=http://watchtower:8080"
      - "com.centurylinklabs.watchtower.enable=true"

  # ===========================================
  # DOZZLE - Log Viewer
  # ===========================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mediastack
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "homepage.group=Core"
      - "homepage.name=Dozzle"
      - "homepage.icon=dozzle.png"
      - "homepage.href=http://dozzle.${DOMAIN}"
      - "homepage.description=Log Viewer"
    expose:
      - 8080

  # ===========================================
  # HOMEPAGE - Dashboard
  # ===========================================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HOMEPAGE_VAR_DOMAIN=${DOMAIN}
      - HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_TOKEN:-}
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mediastack
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - 3000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_NETWORK}"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.routers.homepage.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.homepage.priority=1"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

  # ===========================================
  # PORTAINER - Docker Management UI
  # ===========================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_ROOT}/portainer:/data
    networks:
      - mediastack
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "homepage.group=Core"
      - "homepage.name=Portainer"
      - "homepage.icon=portainer.png"
      - "homepage.href=http://portainer.${DOMAIN}"
      - "homepage.description=Docker Management"
      - "homepage.widget.type=portainer"
      - "homepage.widget.url=http://portainer:9000"
      - "homepage.widget.env=PORTAINER_TOKEN"
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_NETWORK}"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.routers.portainer.rule=HostRegexp(`portainer.{domain:.+}`)"
      - "traefik.http.routers.portainer.priority=10"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer-path.entrypoints=web"
      - "traefik.http.routers.portainer-path.rule=PathPrefix(`/portainer`)"
      - "traefik.http.routers.portainer-path.priority=20"
      - "traefik.http.routers.portainer-path.middlewares=portainer-stripprefix,portainer-forwarded-prefix"
      - "traefik.http.middlewares.portainer-stripprefix.stripprefix.prefixes=/portainer"
      - "traefik.http.middlewares.portainer-forwarded-prefix.headers.customrequestheaders.X-Forwarded-Prefix=/portainer"
    expose:
      - 9000

  # ===========================================
  # AUTHELIA - Authentication & Authorization
  # ===========================================
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    profiles: ["auth"]
    environment:
      - TZ=${TIMEZONE}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_SESSION_REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "authelia", "healthcheck", "--scheme", "http", "--port", "9091"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ${CONFIG_ROOT}/authelia:/config
    networks:
      - mediastack
    labels:
      - "homepage.group=Core"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.href=https://auth.${DOMAIN}"
      - "homepage.description=SSO & Auth"
    expose:
      - 9091
    depends_on:
      - redis

  # ===========================================
  # REDIS - Session storage for Authelia
  # ===========================================
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    profiles: ["auth"]
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - mediastack
    expose:
      - 6379


  # ===========================================
  # JELLYFIN - Media Server
  # ===========================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MOVIES_PATH}:/data/movies
      - ${TV_SHOWS_PATH}:/data/tvshows
      - ${MUSIC_PATH}:/data/music
      - ${TRANSCODE_PATH}:/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mediastack
    profiles: ["jellyfin"]
    labels:
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin.png"
      - "homepage.href=http://jellyfin.${DOMAIN}"
      - "homepage.description=Media Server"
      - "homepage.widget.type=jellyfin"
      - "homepage.widget.url=http://jellyfin:8096"
      - "homepage.widget.key=${JELLYFIN_API_KEY}"
    expose:
      - 8096


  # ===========================================
  # PLEX - Alternative Media Server
  # ===========================================
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${CONFIG_ROOT}/plex:/config
      - ${MOVIES_PATH}:/movies
      - ${TV_SHOWS_PATH}:/tv
      - ${MUSIC_PATH}:/music
      - ${TRANSCODE_PATH}:/transcode
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - mediastack
    profiles: ["plex"]
    labels:
      - "homepage.group=Media"
      - "homepage.name=Plex"
      - "homepage.icon=plex.png"
      - "homepage.href=http://plex.${DOMAIN}"
      - "homepage.description=Media Server"
      - "homepage.widget.type=plex"
      - "homepage.widget.url=http://plex:32400"
      - "homepage.widget.key=${PLEX_TOKEN}"
    expose:
      - 32400

  # ===========================================
  # SONARR - TV Show Management
  # ===========================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAIN_DB=sonarr
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${TV_SHOWS_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mediastack
    profiles: ["arr", "sonarr"]
    labels:
      - "homepage.group=Automation"
      - "homepage.name=Sonarr"
      - "homepage.icon=sonarr.png"
      - "homepage.href=http://sonarr.${DOMAIN}"
      - "homepage.description=TV Shows"
      - "homepage.widget.type=sonarr"
      - "homepage.widget.url=http://sonarr:8989"
      - "homepage.widget.key=${SONARR_API_KEY}"
    expose:
      - 8989

  # ===========================================
  # RADARR - Movie Management
  # ===========================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAIN_DB=radarr
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mediastack
    profiles: ["arr", "radarr"]
    labels:
      - "homepage.group=Automation"
      - "homepage.name=Radarr"
      - "homepage.icon=radarr.png"
      - "homepage.href=http://radarr.${DOMAIN}"
      - "homepage.description=Movies"
      - "homepage.widget.type=radarr"
      - "homepage.widget.url=http://radarr:7878"
      - "homepage.widget.key=${RADARR_API_KEY}"
    expose:
      - 7878

  # ===========================================
  # PROWLARR - Indexer Manager
  # ===========================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      - flaresolverr
      - postgres
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAIN_DB=prowlarr
      - FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mediastack
    profiles: ["arr", "prowlarr"]
    labels:
      - "homepage.group=Automation"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr.png"
      - "homepage.href=http://prowlarr.${DOMAIN}"
      - "homepage.description=Indexers"
      - "homepage.widget.type=prowlarr"
      - "homepage.widget.url=http://prowlarr:9696"
      - "homepage.widget.key=${PROWLARR_API_KEY}"
    expose:
      - 9696

  # ===========================================
  # FLARESOLVERR - Cloudflare Bypass
  # ===========================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE}
    networks:
      - mediastack
    profiles: ["arr", "prowlarr", "flaresolverr"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    expose:
      - 8191

  # ===========================================
  # QBITTORRENT - Download Client (via Gluetun)
  # ===========================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun # Route traffic through VPN
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${CONFIG_ROOT}/qbittorrent_init:/init_data
      - ${DOWNLOADS_PATH}:/downloads
    # VPN Kill Switch: Only start when Gluetun is healthy
    depends_on:
      gluetun:
        condition: service_healthy
    profiles: ["torrent"]
    labels:
      - "homepage.group=Downloads"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent.png"
      - "homepage.href=http://qbt.${DOMAIN}"
      - "homepage.description=Torrents"
      - "homepage.widget.type=qbittorrent"
      - "homepage.widget.url=http://qbittorrent:8080"
      - "homepage.widget.username=${QBITTORRENT_WIDGET_USERNAME}"
      - "homepage.widget.password=${QBITTORRENT_WIDGET_PASSWORD}"

  # ===========================================
  # GLUETUN - VPN Client
  # ===========================================
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
      - 8080:8080 # qBittorrent WebUI
      - 6881:6881 # qBittorrent TCP
      - 6881:6881/udp # qBittorrent UDP
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=custom # Change to your provider
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
    # VPN Kill Switch: Healthcheck ensures VPN is connected
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/v1/openvpn/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mediastack
    profiles: ["vpn", "torrent"]
    labels:
      - "homepage.group=Downloads"
      - "homepage.name=Gluetun VPN"
      - "homepage.icon=gluetun.png"
      - "homepage.description=VPN Tunnel"
      - "homepage.widget.type=gluetun"
      - "homepage.widget.url=http://gluetun:8000"

  # ===========================================
  # OVERSEERR - Request Management
  # ===========================================
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT}/overseerr:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mediastack
    profiles: ["arr", "overseerr"]
    labels:
      - "homepage.group=Automation"
      - "homepage.name=Overseerr"
      - "homepage.icon=overseerr.png"
      - "homepage.href=http://request.${DOMAIN}"
      - "homepage.description=Requests"
      - "homepage.widget.type=overseerr"
      - "homepage.widget.url=http://overseerr:5055"
      - "homepage.widget.key=${OVERSEERR_API_KEY}"
    expose:
      - 5055

  # ===========================================
  # BAZARR - Subtitle Management (Optional)
  # ===========================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MOVIES_PATH}:/movies
      - ${TV_SHOWS_PATH}:/tv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mediastack
    profiles: ["arr", "bazarr"]
    labels:
      - "homepage.group=Automation"
      - "homepage.name=Bazarr"
      - "homepage.icon=bazarr.png"
      - "homepage.href=http://bazarr.${DOMAIN}"
      - "homepage.description=Subtitles"
      - "homepage.widget.type=bazarr"
      - "homepage.widget.url=http://bazarr:6767"
      - "homepage.widget.key=${BAZARR_API_KEY}"
    expose:
      - 6767

  # ===========================================
  # TAUTULLI - Plex Statistics (Optional)
  # ===========================================
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT}/tautulli:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mediastack
    profiles: ["stats"]
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Tautulli"
      - "homepage.icon=tautulli.png"
      - "homepage.href=http://tautulli.${DOMAIN}"
      - "homepage.description=Plex Stats"
      - "homepage.widget.type=tautulli"
      - "homepage.widget.url=http://tautulli:8181"
      - "homepage.widget.key=${TAUTULLI_API_KEY}"
    expose:
      - 8181

  # ===========================================
  # TDARR - Transcoding Server
  # ===========================================
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:latest
    restart: unless-stopped
    ports:
      - 8265:8265 # WebUI
      - 8266:8266 # Server
    environment:
      - TZ=${TIMEZONE}
      - PUID=${PUID}
      - PGID=${PGID}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - nodeName=MyTdarrNode
    volumes:
      - ${CONFIG_ROOT}/tdarr/server:/app/server
      - ${CONFIG_ROOT}/tdarr/configs:/app/configs
      - ${CONFIG_ROOT}/tdarr/logs:/app/logs
      - ${MOVIES_PATH}:/media/movies
      - ${TV_SHOWS_PATH}:/media/tv
      - ${TRANSCODE_PATH}:/temp
    networks:
      - mediastack
    profiles: ["transcode"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8265"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Transcoding"
      - "homepage.name=Tdarr"
      - "homepage.icon=tdarr.png"
      - "homepage.href=http://tdarr.${DOMAIN}"
      - "homepage.description=Transcoding"
      - "homepage.widget.type=tdarr"
      - "homepage.widget.url=http://tdarr:8265"


  # ===========================================
  # MEALIE - Recipe Manager
  # ===========================================
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT}/mealie:/app/data
    networks:
      - mediastack
    profiles: ["mealie"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/api/app/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Apps"
      - "homepage.name=Mealie"
      - "homepage.icon=mealie.png"
      - "homepage.href=http://mealie.${DOMAIN}"
      - "homepage.description=Recipes & meal plans"
    expose:
      - 9000

  # ===========================================
  # KAVITA - Comics & Books Server
  # ===========================================
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT}/kavita:/config
      - ${BOOKS_PATH}:/books
    networks:
      - mediastack
    profiles: ["kavita"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Apps"
      - "homepage.name=Kavita"
      - "homepage.icon=kavita.png"
      - "homepage.href=http://kavita.${DOMAIN}"
      - "homepage.description=Comics & manga"
    expose:
      - 5000

  # ===========================================
  # AUDIOBOOKSHELF - Audiobooks & Podcasts
  # ===========================================
  audiobookshelf:
    image: lscr.io/linuxserver/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT}/audiobookshelf:/config
      - ${AUDIOBOOKS_PATH}:/audiobooks
      - ${AUDIOBOOKS_PATH}:/podcasts
    networks:
      - mediastack
    profiles: ["audiobookshelf"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13378/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Media"
      - "homepage.name=Audiobookshelf"
      - "homepage.icon=audiobookshelf.png"
      - "homepage.href=http://audiobookshelf.${DOMAIN}"
      - "homepage.description=Audiobooks & podcasts"
    expose:
      - 13378

  # ===========================================
  # PHOTOPRISM - Photo Library
  # ===========================================
  photoprism:
    image: lscr.io/linuxserver/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - PHOTOPRISM_ADMIN_PASSWORD=${PHOTOPRISM_ADMIN_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/photoprism:/config
      - ${PHOTOS_PATH}:/photos
    networks:
      - mediastack
    profiles: ["photoprism"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2342/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "homepage.group=Apps"
      - "homepage.name=PhotoPrism"
      - "homepage.icon=photoprism.png"
      - "homepage.href=http://photoprism.${DOMAIN}"
      - "homepage.description=Photo library"
    expose:
      - 2342

  # ===========================================
  # NOTIFIARR - Unified Notifications & Monitoring
  # https://notifiarr.com - Integrates with Discord, Plex, *Arr apps
  # ===========================================
  notifiarr:
    container_name: notifiarr
    hostname: notifiarr
    image: golift/notifiarr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 5454:5454
    volumes:
      - ${CONFIG_ROOT}/notifiarr:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/utmp:/var/run/utmp:ro
    environment:
      - TZ=${TIMEZONE}
      - DN_API_KEY=${NOTIFIARR_API_KEY:-}
      - DN_PLEX_URL=http://plex:32400
      - DN_PLEX_TOKEN=${PLEX_TOKEN:-}
      - DN_SONARR_0_URL=http://sonarr:8989
      - DN_SONARR_0_API_KEY=${SONARR_API_KEY:-}
      - DN_RADARR_0_URL=http://radarr:7878
      - DN_RADARR_0_API_KEY=${RADARR_API_KEY:-}
      - DN_PROWLARR_0_URL=http://prowlarr:9696
      - DN_PROWLARR_0_API_KEY=${PROWLARR_API_KEY:-}
      - DN_BAZARR_0_URL=http://bazarr:6767
      - DN_BAZARR_0_API_KEY=${BAZARR_API_KEY:-}
    networks:
      - mediastack
    profiles: ["notify"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5454/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifiarr.entrypoints=web"
      - "traefik.http.routers.notifiarr.rule=HostRegexp(`notifiarr.{domain:.+}`)"
      - "traefik.http.routers.notifiarr.priority=10"
      - "traefik.http.services.notifiarr.loadbalancer.server.port=5454"
      - "homepage.group=Monitoring"
      - "homepage.name=Notifiarr"
      - "homepage.icon=notifiarr.png"
      - "homepage.href=http://notifiarr.${DOMAIN}"
      - "homepage.description=Unified notifications & monitoring"

  # ===========================================
  # LOKI - Log Aggregation
  # ===========================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    volumes:
      - ${CONFIG_ROOT}/loki:/etc/loki
      - ${CONFIG_ROOT}/loki/data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - mediastack
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Loki"
      - "homepage.icon=loki.png"
      - "homepage.description=Log Aggregation"
    expose:
      - 3100

  # ===========================================
  # PROMTAIL - Log Collector
  # ===========================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ${CONFIG_ROOT}/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - mediastack
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - loki

  # ===========================================
  # GRAFANA - Monitoring Dashboard
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.${DOMAIN}
    volumes:
      - ${CONFIG_ROOT}/grafana:/var/lib/grafana
      - ${CONFIG_ROOT}/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - mediastack
    depends_on:
      - loki
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Grafana"
      - "homepage.icon=grafana.png"
      - "homepage.href=http://grafana.${DOMAIN}"
      - "homepage.description=Logs & Metrics"
      - "homepage.widget.type=grafana"
      - "homepage.widget.url=http://grafana:3000"
      - "homepage.widget.username=${GRAFANA_USER:-admin}"
      - "homepage.widget.password=${GRAFANA_PASSWORD}"
      - "traefik.enable=true"
      - "traefik.docker.network=${DOCKER_NETWORK}"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.rule=HostRegexp(`grafana.{domain:.+}`)"
      - "traefik.http.routers.grafana.priority=10"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    expose:
      - 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
